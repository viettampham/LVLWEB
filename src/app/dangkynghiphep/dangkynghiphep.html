<div>
    <div class="leave-page">

    <!-- Thông tin nhân viên -->
    <div class="card">
        <div class="card-header">
            <span>Thông tin nhân viên</span>
        </div>

        <div class="employee-info">

            <div class="info-item">
                <label>Mã nhân viên</label>
                <span>{{CurrentUser.CodeUser}}</span>
            </div>

            <div class="info-item">
                <label>Họ tên</label>
                <span>{{CurrentUser.Fullname}}</span>
            </div>

            <div class="info-item">
                <label>Phòng ban</label>
                <span>{{CurrentUser.PhongBan}}</span>
            </div>

            <div class="info-item">
                <label>Chức vụ</label>
                <span>{{CurrentUser.ChucVu}}</span>
            </div>

            <div class="info-item">
                <label>Liên hệ</label>
                <span>{{CurrentUser.PhoneNumber}}</span>
            </div>

        </div>
    </div>

    <div class="content">

        <!-- Form nghỉ phép -->
        <div class="card form-section">

            <div class="card-header">
                <span>Thông tin nghỉ phép</span>
            </div>

            <form nz-form nzLayout="inline" [formGroup]="FormRegisLeave" (ngSubmit)="handleRegisleave(0)">
                <div class="form-body w-full">
                    <div class="row">
                        <div class="form-group">
                            <label>Loại nghỉ phép</label>
                            <nz-form-item>
                            <nz-form-control nzErrorTip="Chọn loại nghỉ phép!">
                                <nz-select formControlName="leaveType">
                                    <nz-option nzValue="" nzLabel="-- Chọn loại nghỉ phép --" />
                                    <nz-option *ngFor="let item of DsTypeLeave()" nzValue="{{item.leaveType1}}" nzLabel="{{item.leaveType1}}" />
                                </nz-select>
                            </nz-form-control>
                        </nz-form-item>
                        </div>

                        <div class="form-group">
                            <label>Hình thức nghỉ</label>
                            <nz-form-item>
                                <nz-form-control nzErrorTip="Chọn ca nghỉ!">
                                    <nz-select formControlName="typeShift">
                                        <nz-option nzValue="" nzLabel="-- Chọn thời hạn nghỉ phép --" />
                                        <nz-option nzValue="Nghỉ buổi sáng" nzLabel="Nghỉ buổi sáng" />
                                        <nz-option nzValue="Nghỉ buổi chiều" nzLabel="Nghỉ buổi chiều" />
                                        <nz-option nzValue="Nghỉ cả ngày" nzLabel="Nghỉ cả ngày" />
                                        <nz-option nzValue="Nghỉ dài ngày" nzLabel="Nghỉ dài ngày" />
                                    </nz-select>
                                </nz-form-control>
                            </nz-form-item>
                            
                        </div>
                    </div>

                    <div class="row">
                        <div class="form-group">
                            <label>Từ ngày</label>
                            <nz-form-item>
                                <nz-form-control nzErrorTip="Chọn từ ngày!">
                                    <nz-date-picker [nzDisabledDate]="disabledFromDate" formControlName="fromDate" nzFormat="dd/MM/yyyy"></nz-date-picker>
                                </nz-form-control>
                            </nz-form-item>
                        </div>

                        <div class="form-group" *ngIf="leaveShift()">
                            <label>Đến ngày</label>
                            <nz-form-item>
                                <nz-form-control nzErrorTip="Chọn đến ngày!">
                                    <nz-date-picker formControlName="toDate" [nzDisabledDate]="disabledToDate" nzFormat="dd/MM/yyyy"></nz-date-picker>
                                </nz-form-control>
                            </nz-form-item>
                        </div>

                        <div class="form-group">
                            <label>Số ngày nghỉ</label>
                            <nz-form-item>
                                <nz-form-control nzErrorTip="Tổng số ngày nghỉ!">
                                    <input class="text-center" nz-input readonly formControlName="totalDay">
                                </nz-form-control>
                            </nz-form-item>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Lý do nghỉ</label>
                        <nz-form-item>
                            <nz-form-control nzErrorTip="Nhập lý do nghỉ!!">
                                <textarea nz-input formControlName="reason" rows="4"></textarea>
                            </nz-form-control>
                        </nz-form-item>
                    </div>

                    <div class="footer-action">
                        <button nz-button (click)="resetForm()"><nz-icon nzType="clear" nzTheme="outline" />Làm mới</button>
                        <button nz-button [nzLoading]="loadings()[0]"  nzType="default" (click)="handleRegisleave(0)"><nz-icon nzType="save" nzTheme="outline" />Lưu nháp</button>
                        <button  nz-button [nzLoading]="loadings()[1]" nzType="primary" (click)="handleRegisleave(1)"><nz-icon nzType="send" nzTheme="outline" />Gửi phê duyệt</button>
                    </div>
                </div>
            </form>

            
        </div>

        <!-- Sidebar -->
        <div class="sidebar">

            <div class="card">
                <div class="card-header">
                    Thông tin phép
                </div>

                <div class="leave-balance">
                    <div>
                        <span>Tổng số phép</span>
                        <b>12</b>
                    </div>

                    <div>
                        <span>Đã sử dụng</span>
                        <b>4</b>
                    </div>

                    <div>
                        <span>Còn lại</span>
                        <b class="green">8</b>
                    </div>
                </div>
            </div>

        </div>

    </div>

    

</div>
</div>
